[package]
name = "quick-serve-pos"
version = "0.1.0"
description = "Quick Serve POS - Frente de Caixa Desktop"
edition = "2021"

[lib]
name = "quick_serve_pos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json", "gzip", "deflate", "brotli"] }
flate2 = "1"
